name: Desktop package validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:pack
      - name: Audit packaged contents
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            apps=(desktop-artifacts/mac*/"Dragons Agent.app")
            [[ ${#apps[@]} -eq 1 ]]
            pnpm verify:desktop-package "${apps[0]}/Contents/Resources/app.asar"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            pnpm verify:desktop-package "desktop-artifacts/win-unpacked/resources/app.asar"
          else
            pnpm verify:desktop-package "desktop-artifacts/linux-unpacked/resources/app.asar"
          fi
      - name: Smoke actual packaged executable (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            apps=(desktop-artifacts/mac*/"Dragons Agent.app")
            [[ ${#apps[@]} -eq 1 ]]
            pnpm acceptance:installed "${apps[0]}/Contents/MacOS/Dragons Agent"
          else
            pnpm acceptance:installed "desktop-artifacts/win-unpacked/Dragons Agent.exe"
          fi
      - name: Verify packaged Windows native credential stores (synthetic accounts)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/verify-desktop-credentials.mjs "desktop-artifacts/win-unpacked/Dragons Agent.exe" "desktop-artifacts/win-unpacked/resources/app.asar"
      - name: Exercise Windows native workspace picker
        if: runner.os == 'Windows'
        run: node scripts/verify-desktop-picker.mjs "desktop-artifacts/win-unpacked/Dragons Agent.exe"
      # Linux needs a display and a working Chromium sandbox. Do not add --no-sandbox.
      - name: Prepare sandboxed Linux application (ephemeral runner only)
        if: runner.os == 'Linux'
        run: |
          test "$(id -u)" -ne 0
          test -f desktop-artifacts/linux-unpacked/chrome-sandbox
          test ! -L desktop-artifacts/linux-unpacked/chrome-sandbox
          sudo cp -R desktop-artifacts/linux-unpacked /opt/dragons-ci
          sudo chown -R root:root /opt/dragons-ci
          sudo chmod -R go-w /opt/dragons-ci
          sudo chmod 4755 /opt/dragons-ci/chrome-sandbox
          test "$(stat -c '%u:%g:%a' /opt/dragons-ci/chrome-sandbox)" = '0:0:4755'
          sudo install -o root -g root -m 644 scripts/dragons-ci.apparmor /etc/apparmor.d/dragons-ci
          sudo apparmor_parser -r /etc/apparmor.d/dragons-ci
      - name: Smoke actual packaged executable (Linux)
        if: runner.os == 'Linux'
        env:
          CHROME_DEVEL_SANDBOX: /opt/dragons-ci/chrome-sandbox
        run: xvfb-run --auto-servernum pnpm acceptance:installed /opt/dragons-ci/dragons-agent
      - name: Verify packaged Linux native credential stores (synthetic accounts)
        if: runner.os == 'Linux'
        run: node scripts/verify-desktop-credentials.mjs /opt/dragons-ci/dragons-agent /opt/dragons-ci/resources/app.asar
      - name: Exercise Linux native workspace picker
        if: runner.os == 'Linux'
        env:
          CHROME_DEVEL_SANDBOX: /opt/dragons-ci/chrome-sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool
          xvfb-run --auto-servernum node scripts/verify-desktop-picker.mjs /opt/dragons-ci/dragons-agent
      - name: Remove Linux runner sandbox configuration
        if: always() && runner.os == 'Linux'
        run: |
          status=0
          if [[ -f /etc/apparmor.d/dragons-ci ]]; then
            sudo apparmor_parser -R /etc/apparmor.d/dragons-ci || status=1
            sudo rm /etc/apparmor.d/dragons-ci || status=1
          fi
          sudo rm -rf /opt/dragons-ci || status=1
          exit "$status"
      - run: pnpm desktop:dist
      - name: Prepare AppImage FUSE support (ephemeral Linux runner only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64
          test -c /dev/fuse
      - name: Install, exercise and purge Linux DEB
        if: runner.os == 'Linux'
        run: |
          node --test scripts/desktop-linux-acceptance.test.mjs
          packages=(desktop-artifacts/*.deb)
          [[ ${#packages[@]} -eq 1 ]]
          node scripts/verify-desktop-linux.mjs deb "${packages[0]}"
      - name: Mount, exercise and unmount Linux AppImage
        if: runner.os == 'Linux'
        run: |
          images=(desktop-artifacts/*.AppImage)
          [[ ${#images[@]} -eq 1 ]]
          node scripts/verify-desktop-linux.mjs appimage "${images[0]}"
      - name: Install, exercise and uninstall Windows NSIS application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/desktop-nsis-cleanup.test.ps1
          ./scripts/verify-desktop-nsis.ps1
      - name: Mount, copy, launch and remove macOS image application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          images=(desktop-artifacts/*.dmg)
          [[ ${#images[@]} -eq 1 ]]
          pnpm acceptance:desktop-dmg "${images[0]}"
      # No upload, signing credentials, release, tag, or publishing in this validation workflow.
